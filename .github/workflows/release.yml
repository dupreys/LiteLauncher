name: Release

# Publishing a version tag (for example v1.0.0) builds the program and attaches the installer to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test --nologo

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/LiteLauncher.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\LiteLauncher.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }

      - name: Zip the portable exe
        shell: pwsh
        run: Compress-Archive -Path publish\LiteLauncher.exe -DestinationPath dist\LiteLauncher-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher
          path: |
            dist/LiteLauncher-Setup.exe
            dist/LiteLauncher-portable.zip

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LiteLauncher-Setup.exe
            dist/LiteLauncher-portable.zip
